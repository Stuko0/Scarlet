name: scarlet_app
description: Scarlet - Tactical Fire Response Application
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.8.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.0.1

  # Utilities
  intl: ^0.20.2
  dio_http2_adapter: ^2.6.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/logos/
    - assets/img/icons/
    - .env
